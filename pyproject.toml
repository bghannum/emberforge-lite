# Emberforge Lite — development tooling configuration.
#
# The *installed* application is standard-library only; the entries below are
# development-time only (test runner, linter, coverage). Full package build
# metadata is added in Milestone 2.

[project]
name = "emberforge-lite"
version = "0.1.0.dev0"
description = "Local-first review workbench for generated game-character assets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bghannum" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = [
    "naming",
    "linking",
    "media",
    "audiotools",
    "gifspeed",
    "pngtools",
    "credentials",
    "generate",
    "build",
    "server",
    "providers",
]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# `providers` and `media` deliberately reach into internal helpers across
# modules; the characterization suite pins that behavior.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
