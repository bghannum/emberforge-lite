name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish a GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Re-run the full test suite
        run: pytest -q
      - name: Build wheel and sdist
        run: pyproject-build
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Clean-install smoke test
        run: |
          python -m venv /tmp/rel
          /tmp/rel/bin/pip install dist/emberforge_lite-*.whl
          /tmp/rel/bin/emberforge-lite --version
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          # Install for users:
          #   pipx install git+https://github.com/bghannum/emberforge-lite.git@${{ github.ref_name }}
      # PyPI publishing is intentionally disabled for v0.1.0.
